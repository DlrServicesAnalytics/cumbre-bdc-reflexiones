<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cumbre Líderes de BDC Kia México 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#05141F;--ink2:#3A4650;--mute:#6B7780;--line:#E3E7EA;--bg:#F4F6F7;--ok:#1F8A5B;--acc:#3DD6C4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
header{background:var(--ink);color:#fff;padding:20px 18px 28px;position:relative}
.logos{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.logos .kia{height:22px}.logos .cdk{height:18px}
.ev{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;font-weight:600}
h1{font-size:24px;line-height:1.2;margin-top:10px;font-weight:800;text-wrap:balance}
.bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--acc)}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.anon{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2);line-height:1.45}
.anon svg{flex:none;margin-top:1px}
.help{font-size:14px;color:var(--ink2);line-height:1.5;margin:18px 2px 10px}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:16px;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.cnt{font-size:12px;color:var(--mute)}
.send{all:unset;cursor:pointer;background:var(--ink);color:#fff;font-weight:700;font-size:16px;padding:14px 26px;border-radius:12px}
.send[disabled]{opacity:.35;cursor:default}
.err{color:#B42318;font-size:13px;margin-top:10px;display:none}
.sent{margin-top:20px;font-size:13px;color:var(--ok);font-weight:600;display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--ok);color:#fff;padding:14px 20px;border-radius:12px;font-weight:600;font-size:14px;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.demo{background:#FFF4D6;color:#7A5600;font-size:12px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
footer{text-align:center;font-size:11px;color:var(--mute);padding:10px 0 30px}
</style>
</head>
<body>
<header>
  <div class="logos"><img class="kia" src="assets/logo-kia.png" alt="Kia" onerror="this.remove()"><img class="cdk" src="assets/logo-cdk.png" alt="CDK Global" onerror="this.remove()"></div>
  <div class="ev">Cumbre Líderes de BDC Kia México 2026</div>
  <h1 id="preg"></h1>
  <div class="bar"></div>
</header>
<main>
  <div id="demo"></div>
  <div class="anon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <span><b>Tu respuesta es anónima.</b> No pedimos nombre, correo ni agencia.</span></div>
  <p class="help" id="ayuda"></p>
  <textarea id="ta" placeholder="Ej.: Cubrir turnos de noche, cuando más leads llegan"></textarea>
  <div class="row"><span class="cnt" id="cnt"></span><button class="send" id="send" type="button" disabled>Enviar</button></div>
  <div class="err" id="err"></div>
  <div class="sent" id="sent"></div>
</main>
<footer>CDK Global · Las respuestas son anónimas</footer>
<div class="toast" id="toast">¡Gracias! Tu respuesta ya está en pantalla.</div>
<script type="module">
import { PREGUNTA, AYUDA, MAX, MIN } from "./data.js";
import { store, MODE } from "./store.js";
const $ = s => document.getElementById(s);
$("preg").textContent = PREGUNTA; $("ayuda").textContent = AYUDA; $("ta").maxLength = MAX; $("cnt").textContent = `0 / ${MAX}`;
if (MODE === "demo") $("demo").innerHTML = `<div class="demo">Modo demostración: las respuestas solo se guardan en este navegador.</div>`;
let last = 0, n = 0;
$("ta").oninput = () => { $("cnt").textContent = `${$("ta").value.length} / ${MAX}`; const L = $("ta").value.length; $("cnt").style.color = L >= MAX - 15 ? "#B42318" : ""; $("send").disabled = $("ta").value.trim().length < MIN; };
$("send").onclick = async () => {
  const text = $("ta").value.trim().slice(0, MAX), b = $("send"), err = $("err");
  if (Date.now() - last < 4000) { err.textContent = "Espera unos segundos antes de enviar otra respuesta."; err.style.display = "block"; return; }
  b.disabled = true; b.textContent = "Enviando…"; err.style.display = "none";
  try {
    const s = await store();
    await Promise.race([s.add(text), new Promise((_, r) => setTimeout(() => r(new Error("timeout")), 12000))]);
    last = Date.now(); n++;
    $("ta").value = ""; $("cnt").textContent = `0 / ${MAX}`;
    $("sent").textContent = `Has enviado ${n} ${n === 1 ? "respuesta" : "respuestas"}. Puedes agregar otra idea.`; $("sent").style.display = "block";
    const t = $("toast"); t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2600);
  } catch (e) { err.textContent = "No se pudo enviar. Revisa tu conexión e inténtalo de nuevo."; err.style.display = "block"; }
  b.textContent = "Enviar"; b.disabled = $("ta").value.trim().length < MIN;
};
</script>
</body>
</html>
